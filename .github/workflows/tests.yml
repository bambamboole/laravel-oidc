name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client, ui]
    name: Lint & static analysis (${{ matrix.package }})
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          working-directory: packages/${{ matrix.package }}

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [server, client, ui]
        php: ['8.4']
        testbench: ['10.*', '11.*']
        stability: [prefer-stable, prefer-lowest]

    name: ${{ matrix.package }} - PHP ${{ matrix.php }} - Testbench ${{ matrix.testbench }} - ${{ matrix.stability }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Advisory blocking stays ON (Composer's default): a consumer with
      # default settings cannot install advisory-affected versions either, so
      # the lowest cells test the lowest set that is actually installable.
      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          working-directory: packages/${{ matrix.package }}
          php-version: ${{ matrix.php }}
          testbench: ${{ matrix.testbench }}
          dependency-versions: ${{ matrix.stability == 'prefer-lowest' && 'lowest' || 'highest' }}

      - name: Tests (Pest)
        run: vendor/bin/pest

  mautic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        mautic: ['7.0', '7.1']
    name: mautic plugin - PHP ${{ matrix.php }} - Mautic ${{ matrix.mautic }}
    defaults:
      run:
        working-directory: packages/mautic
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath, openssl, mbstring, dom, curl, json, intl, gd, zip, imap
          coverage: none

      - name: Pin Mautic
        run: composer require "mautic/core-lib:~${{ matrix.mautic }}.0" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/mautic
          composer-options: --prefer-dist

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit

  keyless-boot:
    runs-on: ubuntu-latest
    name: Keyless boot (no APP_KEY)
    defaults:
      run:
        working-directory: packages/server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup package
        uses: ./.github/actions/setup-package
        with:
          working-directory: packages/server

      - name: Discover packages without an app key
        run: APP_KEY= vendor/bin/testbench package:discover --ansi

  master:
    runs-on: ubuntu-latest
    name: Master package integrity
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gmp, bcmath, openssl, mbstring, dom, curl, json
          coverage: none

      - name: Validate root composer.json
        run: composer validate --strict

      - name: Smoke-install the master as a consumer
        run: |
          mkdir -p /tmp/master-smoke && cd /tmp/master-smoke
          cat > composer.json <<JSON
          {
              "repositories": [
                  {"type": "path", "url": "${GITHUB_WORKSPACE}", "options": {"symlink": false}}
              ],
              "require": {"bambamboole/laravel-oidc": "*"},
              "minimum-stability": "dev",
              "prefer-stable": true
          }
          JSON
          composer install --no-interaction
          php -r "require 'vendor/autoload.php'; exit(class_exists('Bambamboole\\LaravelOidc\\Server\\OidcServiceProvider') && class_exists('Bambamboole\\LaravelOidc\\Client\\OidcClientServiceProvider') && class_exists('Bambamboole\\LaravelOidc\\Ui\\UiServiceProvider') ? 0 : 1);"

      # Guards the master package's ONLY path to Lattice discovery: the ui package is
      # replace()d, so packages/ui/composer.json is never read from a master install —
      # only this root composer.json's lattice-php/lattice constraint and extra.lattice
      # govern it. Fails loudly if either regresses.
      - name: Assert lattice discovery for master installs
        working-directory: /tmp/master-smoke
        run: |
          php -r '
          require "vendor/autoload.php";
          $version = Composer\InstalledVersions::getVersion("lattice-php/lattice");
          if ($version === null || version_compare($version, "0.70.0", "<")) {
              fwrite(STDERR, "lattice-php/lattice version too low: ".var_export($version, true)."\n");
              exit(1);
          }
          $roots = Lattice\Core\Discovery\ComponentPackages::discoverRoots();
          foreach ($roots as $root) {
              if (str_ends_with($root, "packages/ui/src")) {
                  exit(0);
              }
          }
          fwrite(STDERR, "packages/ui/src missing from discovery roots: ".implode(", ", $roots)."\n");
          exit(1);
          '
